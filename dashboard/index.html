<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>市场 ETF 看板</title>
    <meta name="description" content="市场 ETF 份额变化与行情, 汪汪队 ETF 标签突出">

    <script>(function(){try{var t=localStorage.getItem('nt-theme');document.documentElement.setAttribute('data-theme',(t==='dark'||t==='light')?t:'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>

    <link rel="stylesheet" href="/css/style.css">

    <script>window.NT_BASE = "/";</script>
    <script src="/js/theme.js"></script>
    <script src="/js/core.js"></script>
    <script src="/js/components.js"></script>

    <script src="/js/vendor/echarts.min.js"></script>
    <script>window.echarts || document.write('<script src="https://unpkg.com/echarts@5.5.1/dist/echarts.min.js"><\/script>');</script>

<script src="/js/static-shim.js"></script></head>
<body>
<div class="app-container">
<header class="header">
    <div class="header-title">
        <span class="icon">🧺</span>
        <div>
            <h1>市场 ETF 看板</h1>
            <span id="shareUpdateDate" class="header-subtitle">份额数据加载中...</span>
        </div>
    </div>
    <div class="header-meta">
<nav class="nav-links" data-theme-slot>
    <a href="/" class="nav-link">🏠 首页</a>
    <a href="/dashboard" class="nav-link active">🧺 ETF</a>
    <a href="/stocks" class="nav-link">🔍 个股</a>
    <a href="/futures" class="nav-link">🛢️ 期货</a>
    <a href="/gold" class="nav-link">🥇 黄金</a>
    <a href="/fx" class="nav-link">💱 汇率</a>
    <a href="/market" class="nav-link">🌐 市场分析</a>
    <a href="/reports" class="nav-link">📄 报告汇总</a>
</nav>    </div>
</header>

<section class="card">
    <div class="card-header">
        <div class="card-title"><span class="emoji">📈</span>ETF 总份额变化 &amp; 指数价格走势</div>
        <div class="time-selector" id="timeSelector">
    <button class="time-btn" data-days="30">1月</button>
    <button class="time-btn" data-days="90">3月</button>
    <button class="time-btn active" data-days="365">1年</button>
</div>
    </div>
    <div class="chart-container" id="mainChart"><div class="loading-overlay"><div class="spinner"></div>加载图表数据...</div></div>

</section>
<section class="card">
    <div class="card-header">
        <div class="card-title"><span class="emoji">📋</span>市场 ETF 明细</div>
<div class="header-meta"><span id="etfCount">-</span></div>        
    </div>
    <div class="table-wrapper">
    <table id="etfTable">
        <thead>
            <tr>
                <th data-sort="ts_code">代码</th>
                <th data-sort="name">名称</th>
                <th>汪汪队</th>
                <th data-sort="close">现价</th>
                <th data-sort="price_chg_pct">涨跌</th>
                <th data-sort="latest_share">最新份额(亿)</th>
                <th data-sort="share_chg_1d">日变化%</th>
                <th data-sort="share_chg_1w">周变化%</th>
                <th data-sort="share_chg_1m">月变化%</th>
                <th data-sort="share_chg_3m">季变化%</th>
                <th data-sort="share_chg_1y">年变化%</th>
                <th data-sort="nt_hold_ratio">汪汪队占比%</th>
                <th data-sort="pen_value">穿透市值(亿)</th>
                <th data-sort="pen_stock_count">穿透个股</th>
                <th data-sort="basket_coverage">篮子覆盖率</th>
                <th>报告期</th>
            </tr>
        </thead>
        <tbody id="etfTableBody"><tr><td colspan="16" class="no-data"><div class="loading-overlay"><div class="spinner"></div>加载数据...</div></td></tr></tbody>
    </table>
</div>
<div class="pager">
    <button id="prevPage" disabled>← 上一页</button>
    <span class="page-info" id="pageInfo">- / -</span>
    <button id="nextPage" disabled>下一页 →</button>
</div>

</section>

<footer class="site-footer">
    <span>数据来源：上交所 · 深交所 · 东方财富</span>
    <span class="footer-dot">·</span>
    <span>市场数据，汪汪队/机构为分析维度</span>
    <span class="footer-dot">·</span>
    <span>仅供研究参考，不构成投资建议</span>
</footer></div>

<script src="/js/main.js"></script></body>
</html>
